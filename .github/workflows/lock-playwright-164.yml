name: Lock Playwright 1.64

# One-shot helper. It patches package-lock.json to the installed 1.64.0 bytes
# and pushes that commit. This file is removed after the lockfile matches.
on:
  push:
    branches: [cursor/playwright-1-64-b8fd]
    paths: [.github/workflows/lock-playwright-164.yml]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cursor/playwright-1-64-b8fd
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch package-lock.json
        run: |
          python3 << 'PY'
          from pathlib import Path
          path = Path("package-lock.json")
          text = path.read_text()
          replacements = [
              ('"@playwright/test": "^1.48.1"', '"@playwright/test": "^1.64.0"', 1),
              ("https://registry.npmjs.org/@playwright/test/-/test-1.63.0.tgz", "https://registry.npmjs.org/@playwright/test/-/test-1.64.0.tgz", 1),
              ("sha512-oxMK4vllB9RK5NQ2l1pq1IfOf2AvnEuj/vYGDj0H2nMtmtZpKtCwt/l00GEO6xjGfpBNAvjovvYdCm50dRQkpQ==", "sha512-oTN9FNYuN6bqQMwiho6jJKLCG2/QOYCixGXuCjRmzOq23eODeukuY2XiAVoVpAECbuezMt1MHQjAiQxK8F+Y+g==", 1),
              ('"playwright": "1.63.0"', '"playwright": "1.64.0"', 1),
              ("https://registry.npmjs.org/playwright/-/playwright-1.63.0.tgz", "https://registry.npmjs.org/playwright/-/playwright-1.64.0.tgz", 1),
              ("sha512-+7ziBLidS4NaNCdt57SUDT+wYmmd5fmiQejUic/kb+YsYSCPyOOE9sebzMjNmQrsnNpDJqd4WHvV/8lfKfUDUg==", "sha512-kVzTnYFYEyQ9RGzBjNCd2+yEqWmVbxl3AHPynv3qQ6JTjv4a+kwRcnqQwIpuP3NnrnIrE/Q6wWAIAvMfIE2/Yg==", 1),
              ('"playwright-core": "1.63.0"', '"playwright-core": "1.64.0"', 1),
              ("https://registry.npmjs.org/playwright-core/-/playwright-core-1.63.0.tgz", "https://registry.npmjs.org/playwright-core/-/playwright-core-1.64.0.tgz", 1),
              ("sha512-rYCsBF/M5HjUch52bbtVONEFjv6Xu8sm8h72dNlR5bzIE1fvC/bxgspzkjSfU+MweEMmPM8KJebG6nnyxo5mCg==", "sha512-T9r+MZkTECl2+oUcZ26YgZzTrYidTsIhYYkJix+6iDOymOb1FB2RLLSOxRGnZGv5DStt+aduIVbt+E8WygXYpg==", 1),
              ('"version": "1.63.0"', '"version": "1.64.0"', 3),
          ]
          for old, new, expected in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"count {count} != {expected} for {old[:40]}")
              text = text.replace(old, new)
          path.write_text(text)
          print("patched", len(text.encode()))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock @playwright/test at 1.64.0."
          git push origin HEAD:cursor/playwright-1-64-b8fd
