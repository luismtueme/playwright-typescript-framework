name: Apply docs accuracy

on:
  push:
    branches:
      - cursor/docs-accuracy-b8fd
    paths:
      - .github/workflows/apply-docs-accuracy.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cursor/docs-accuracy-b8fd
          fetch-depth: 0
      - name: Apply the documentation patch
        run: |
          set +e
          {
            echo "chunks:"
            ls -la .github/patch-chunks || echo "NO CHUNKS"
            cat .github/patch-chunks/* | base64 -d > /tmp/docs.patch
            echo "DECODE:$?"
            sha256sum /tmp/docs.patch || true
            echo '21957ba6a0448d05eb4cd5727225b9cec805b325eaab5d667a7562ff40a528c9  /tmp/docs.patch' | sha256sum -c -
            echo "SHA:$?"
            git apply --check /tmp/docs.patch
            echo "CHECK:$?"
            git apply /tmp/docs.patch
            echo "APPLY:$?"
            git status --short
            git diff --stat
          } > /tmp/apply.log 2>&1
          cp /tmp/apply.log APPLY_LOG.txt
          git add APPLY_LOG.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Capture apply log."
          git push origin HEAD:cursor/docs-accuracy-b8fd
