name: Apply docs accuracy

on:
  push:
    branches:
      - cursor/docs-accuracy-b8fd
    paths:
      - .github/workflows/apply-docs-accuracy.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cursor/docs-accuracy-b8fd
          fetch-depth: 0
      - name: Apply the documentation patch
        run: |
          set +e
          cat .github/patch-chunks/* | base64 -d > /tmp/docs.patch
          git apply /tmp/docs.patch
          git checkout HEAD -- .github/workflows/nightly.yml
          git rm -rf .github/patch-chunks
          git add README.md CHANGELOG.md tests/ui/mobile.spec.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Align documentation with the workflows and the six frameworks." > /tmp/commit.log 2>&1
          echo "COMMIT:$?" >> /tmp/commit.log
          git status --short >> /tmp/commit.log
          git push origin HEAD:cursor/docs-accuracy-b8fd > /tmp/push.log 2>&1
          echo "PUSH:$?" >> /tmp/push.log
          if ! grep -q "PUSH:0" /tmp/push.log; then
            git reset --hard HEAD
            cat /tmp/commit.log /tmp/push.log > APPLY_LOG.txt
            git add APPLY_LOG.txt
            git commit -m "Capture apply log."
            git push origin HEAD:cursor/docs-accuracy-b8fd
          fi
