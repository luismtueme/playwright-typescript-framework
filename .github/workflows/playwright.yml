name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Uncomment to enable scheduled runs (daily at 4 AM UTC)
  # schedule:
  #   - cron: '0 4 * * *'

# Least privilege by default; jobs that need more ask for it explicitly
permissions:
  contents: read

# A newer push to the same PR cancels the older run; runs on main always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22
  # Shards must not publish. The deploy job runs the publisher on the merged document.
  PLAYPRESS_PUBLISH: 'false'

jobs:
  # Fast gate: lint, dependency audit, framework unit tests, step and spec validation (no browser)
  check:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: bash scripts/npm-ci.sh

      - name: Lint and Format Check
        run: npm run lint

      - name: Type Check
        run: npm run typecheck

      # Fails if contracts/openapi.d.ts wasn't regenerated after a contract change
      - name: API Types Match the Contract
        run: npm run check:api

      - name: Audit Dependencies (high and critical)
        run: npm audit --audit-level=high

      - name: Unit Tests (framework code)
        run: npm run test:unit

      - name: Validate Test Definitions
        run: npm run check

  # PRs only: the tests affected by this PR's changes (Playwright's --only-changed follows
  # imports, so a change to a page object or fixture selects every test that uses it).
  # They run once for fast feedback, then 10 more times to catch flakiness before merging.
  burn-in:
    name: Burn-in
    needs: check
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: testdb
          MYSQL_USER: tester
          MYSQL_PASSWORD: ci-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CI: true
      TEST_ENV: ci
      TEST_BROWSER: chromium
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: tester
      DB_PASSWORD: ci-password
      DB_NAME: testdb
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          # --only-changed compares against the base branch, so it needs the history
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: bash scripts/npm-ci.sh

      - name: Install Playwright Browser
        run: npx playwright install --with-deps ${{ env.TEST_BROWSER }}

      - name: Affected Tests (fast feedback)
        run: npx playwright test --only-changed=origin/${{ github.base_ref }} --pass-with-no-tests

      # No retries: a test that fails once in 10 runs is flaky, and flaky tests don't merge
      - name: Burn-in (affected tests x10)
        run: >-
          npx playwright test --only-changed=origin/${{ github.base_ref }} --pass-with-no-tests
          --repeat-each=10 --retries=0

      - name: Check for Leftover Test Data
        if: ${{ !cancelled() }}
        run: npm run check:leftovers

      - name: Upload Burn-in Artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: burn-in-artifacts
          path: |
            test-results/
            html-report/
          if-no-files-found: ignore
          retention-days: 14

  # The full suite, split across machines. Each shard has its own MySQL and writes a
  # blob report; the Tests job below merges them into one report.
  test-shard:
    name: Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: testdb
          MYSQL_USER: tester
          MYSQL_PASSWORD: ci-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CI: true
      TEST_ENV: ci
      TEST_BROWSER: chromium
      BLOB_REPORT: true
      # Throwaway CI database. For a real app, read credentials from secrets:
      #   APP_USERNAME: ${{ secrets.APP_USERNAME }}
      #   APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: tester
      DB_PASSWORD: ci-password
      DB_NAME: testdb
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: bash scripts/npm-ci.sh

      - name: Install Playwright Browser
        run: npx playwright install --with-deps ${{ env.TEST_BROWSER }}

      - name: Run Playwright Tests
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # Upload before quarantine: that step is a second Playwright run and would overwrite this directory
      - name: Upload Playpress Shard Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playpress-shard-${{ matrix.shard }}
          path: playpress-report/
          if-no-files-found: error
          retention-days: 3

      # Flaky tests tagged @quarantine run here (once, in shard 1): results reach the
      # report, but never fail the job
      - name: Run Quarantined Tests (non-blocking)
        if: ${{ !cancelled() && matrix.shard == 1 }}
        continue-on-error: true
        # Not a blob: that would overwrite this shard's blob report. A separate
        # playpress directory so the shard document uploaded above stays intact.
        env:
          BLOB_REPORT: false
          PLAYPRESS_OUTPUT_DIR: playpress-report-quarantine
        run: npm run test:quarantine

      - name: Upload Playpress Quarantine Report
        if: ${{ !cancelled() && matrix.shard == 1 }}
        uses: actions/upload-artifact@v7
        with:
          name: playpress-report-quarantine
          path: playpress-report-quarantine/
          if-no-files-found: ignore
          retention-days: 3

      # Every test must delete what it creates; fails the job if rows are left behind
      - name: Check for Leftover Test Data
        if: ${{ !cancelled() }}
        run: npm run check:leftovers

      - name: Upload Blob Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 3

      - name: Upload Allure Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.shard }}
          path: allure-results/
          include-hidden-files: true
          retention-days: 14

      - name: Upload Test Artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-${{ matrix.shard }}
          path: |
            traces/
            videos/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Required check: merges the shard reports, posts the results summary on the PR,
  # and fails if any shard failed
  test:
    name: Tests
    needs: test-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: bash scripts/npm-ci.sh

      - name: Download Blob Reports
        uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge Reports
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: html-report
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report.json
        run: npx playwright merge-reports --reporter=html,json ./all-blob-reports

      # Also fails if the merged report has fewer tests than the suite (a lost shard report)
      - name: Write Results Summary
        shell: bash
        run: |
          LISTED=$(npx playwright test --list | grep -oE 'Total: [0-9]+' | grep -oE '[0-9]+')
          npx tsx utils/prSummary.ts playwright-report.json --listed-tests="$LISTED" | tee summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Download Playpress Shard Reports
        uses: actions/download-artifact@v8
        with:
          pattern: playpress-shard-*
          path: playpress-shards

      - name: Download Playpress Quarantine Report
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: playpress-report-quarantine
          path: playpress-quarantine

      # One full document for the artifact. Profile full keeps error text and media;
      # the file is not deployed. The default-branch job publishes it redacted.
      - name: Union Playpress Reports
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          args=()
          for report in playpress-shards/*/report.json; do
            args+=(--report "$report")
          done
          if [ -f playpress-quarantine/report.json ]; then
            args+=(--report playpress-quarantine/report.json)
          fi
          if [ "${#args[@]}" -eq 0 ]; then
            echo "playpress: no shard report was downloaded"
            exit 1
          fi
          npx playpress publish "${args[@]}" --site playpress-union --profile full
          mapfile -t runs < <(find playpress-union/runs -mindepth 1 -maxdepth 1 -type d | sort)
          if [ "${#runs[@]}" -ne 1 ]; then
            echo "playpress: expected one unioned run, found ${#runs[@]}"
            exit 1
          fi
          rm -rf playpress-report
          mkdir -p playpress-report
          cp "${runs[0]}/report.json" playpress-report/report.json
          if [ -d "${runs[0]}/media" ]; then
            cp -a "${runs[0]}/media" playpress-report/media
          fi

      - name: Write Playpress Summary
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          base_args=()
          if git fetch --depth=1 origin playpress-history; then
            catalog="${RUNNER_TEMP}/playpress-catalog.json"
            git show "origin/playpress-history:catalog.json" > "$catalog"
            rel=$(npx tsx utils/playpressSummary.ts --print-base "$catalog" playpress-report/report.json --branch "$DEFAULT_BRANCH")
            if [ -n "$rel" ]; then
              base="${RUNNER_TEMP}/playpress-base.json"
              git show "origin/playpress-history:${rel}" > "$base"
              base_args=(--base "$base")
            fi
          fi
          deploy_args=()
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/${DEFAULT_BRANCH}" ]; then
            deploy_args=(--deploys)
          fi
          npx tsx utils/playpressSummary.ts playpress-report/report.json --branch "$DEFAULT_BRANCH" "${base_args[@]}" "${deploy_args[@]}" | tee -a summary.md >> "$GITHUB_STEP_SUMMARY"

      # Updates the bot's previous summary comment instead of adding one per push.
      # Skipped for forks and Dependabot, whose tokens can't comment.
      - name: Comment Summary on the PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh pr comment ${{ github.event.pull_request.number }} --body-file summary.md --edit-last --create-if-none
          || gh pr comment ${{ github.event.pull_request.number }} --body-file summary.md

      - name: Upload HTML Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: html-report
          path: html-report/
          retention-days: 14

      # Full document: error text and media. Pull requests stop here. Pushes to the
      # default branch publish a redacted copy from the deploy job.
      - name: Upload Playpress Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playpress-report
          path: playpress-report/
          if-no-files-found: error
          retention-days: 14

      - name: Fail if Any Shard Failed
        if: ${{ needs.test-shard.result != 'success' }}
        run: |
          echo "A test shard failed (result: ${{ needs.test-shard.result }}). See the summary above."
          exit 1

  # Screenshot comparison against tests/visual/__screenshots__, inside the Playwright
  # Docker image so rendering matches the committed baselines exactly
  visual:
    name: Visual
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: bash scripts/npm-ci.sh

      - name: Run Visual Tests
        run: npm run test:visual

      # Expected, actual and diff images for every mismatch
      - name: Upload Visual Diffs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 14

      - name: Upload Playpress Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playpress-report-visual
          path: playpress-report/
          if-no-files-found: ignore
          retention-days: 14

  # Pushes to the default branch only. Pull requests upload playpress-report and do not deploy.
  # History lives on the orphan branch playpress-history, rewritten only by this job.
  report:
    name: Publish Reports
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'skipped' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: playpress-pages
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: bash scripts/npm-ci.sh

      - name: Download Allure Results (all shards)
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: allure-results/
          merge-multiple: true

      - name: Restore Allure History
        uses: actions/cache/restore@v6
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}
          restore-keys: allure-history-

      - name: Generate Allure Report
        id: allure
        continue-on-error: true
        run: |
          if [ -d allure-history ]; then
            mkdir -p allure-results/history && cp -r allure-history/. allure-results/history/
          fi
          npx allure generate ./allure-results --clean -o ./allure-report
          rm -rf allure-history && cp -r ./allure-report/history allure-history

      - name: Save Allure History
        if: steps.allure.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}

      - name: Download Playpress Report
        uses: actions/download-artifact@v8
        with:
          name: playpress-report
          path: playpress-report

      # First deploy creates the orphan branch. Later deploys start from its tip.
      - name: Check out the history branch
        shell: bash
        run: |
          set -euo pipefail
          branch=playpress-history
          site=site
          rm -rf "$site"
          git worktree prune
          git fetch origin "$branch" || true
          if git rev-parse --verify --quiet "refs/remotes/origin/${branch}" >/dev/null; then
            git worktree add "$site" "origin/${branch}"
          else
            git worktree add --detach "$site"
            git -C "$site" checkout --orphan "$branch"
            git -C "$site" rm -rf . >/dev/null 2>&1 || true
            find "$site" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi

      - name: Publish the redacted profile
        shell: bash
        run: |
          set -euo pipefail
          media_args=()
          if [ -d playpress-report/media ]; then
            media_args=(--media playpress-report/media)
          fi
          npx playpress publish --report playpress-report/report.json "${media_args[@]}" --site site --profile redacted

      - name: Push the history branch
        shell: bash
        run: |
          set -euo pipefail
          git -C site add -A
          if git -C site diff --cached --quiet; then
            echo "playpress site has no changes"
            exit 0
          fi
          git -C site \
            -c user.name=github-actions[bot] \
            -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m "Publish playpress run"
          git -C site push origin HEAD:playpress-history

      # Allure is copied after the push, so the history branch stays the playpress archive.
      - name: Assemble the Pages site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -a site/. _site/
          rm -f _site/.git
          if [ -d allure-report ]; then
            cp -a allure-report _site/allure-report
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
